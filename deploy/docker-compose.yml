# Reference HA-style deployment: Postgres-backed shared state, an active control plane, and two
# gateway replicas that share one budget through Postgres (so a failover keeps limits correct).
# NOT production-tuned; a starting point for "run in anger" and a failover drill.
# Secrets come from deploy/.env (copy deploy/.env.example). Never commit real secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acp
      POSTGRES_PASSWORD: ${ACP_PG_PASSWORD:?set ACP_PG_PASSWORD in deploy/.env}
      POSTGRES_DB: acp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  control-plane:
    image: acp:local
    build: { context: .., dockerfile: deploy/Dockerfile }
    # Control-plane API on :8787 (matches systemd and install-server). The console shares this
    # container's network namespace (see acp-console below), so its :8080 is published here too.
    # --store points at the Postgres service so registration, policy and break-glass persist across
    # restarts (B7); the URL scheme selects the backend (postgres:// here).
    command: ["--addr", "0.0.0.0:8787",
              "--ledger", "/data/evidence.db",
              "--approvals", "/data/approvals.db",
              "--store", "postgres://acp:${ACP_PG_PASSWORD}@postgres/acp",
              "--cp-key", "/data/cp.key",
              "--policy-store", "/data/policy",
              "--break-glass-file", "/data/break-glass.signed"]
    ports: ["8787:8787", "8080:8080"]
    healthcheck:
      test: ["CMD", "acp-cli", "verify", "/data/evidence.db"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - cpdata:/data
    depends_on:
      postgres: { condition: service_healthy }

  # Web console (read-only view over the control-plane API).
  # LIMITATION: the console binary hardcodes the control-plane URL http://127.0.0.1:8787
  # (acp-console/src/main.ky) and cannot yet be pointed at a service DNS name without a code change.
  # We therefore share the control-plane's network namespace so 127.0.0.1:8787 resolves to it; the
  # console's own :8080 is published through the control-plane service above.
  # NOTE: this service is NOT built by deploy/Dockerfile (that image ships only the Rust binaries).
  # The console is a Kyte app; build the acp-console:local image separately, or run the acp-console
  # binary from the release archive. Compose will not start it until that image exists.
  acp-console:
    image: acp-console:local
    entrypoint: ["acp-console"]
    command: ["--port", "8080"]
    network_mode: "service:control-plane"
    depends_on:
      control-plane: { condition: service_started }

  gateway-a:
    image: acp:local
    entrypoint: ["acp-gateway"]
    command: ["--addr", "0.0.0.0:8799", "--policy", "/etc/acp/policy.yaml",
              "--upstream", "https://api.anthropic.com", "--budget-pg", "host=postgres user=acp password=${ACP_PG_PASSWORD} dbname=acp",
              "--content-firewall"]
    ports: ["8799:8799"]
    healthcheck:
      test: ["CMD-SHELL", "acp-gateway --help >/dev/null 2>&1 || true; exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes: ["./config:/etc/acp:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  gateway-b:
    image: acp:local
    entrypoint: ["acp-gateway"]
    command: ["--addr", "0.0.0.0:8799", "--policy", "/etc/acp/policy.yaml",
              "--upstream", "https://api.anthropic.com", "--budget-pg", "host=postgres user=acp password=${ACP_PG_PASSWORD} dbname=acp",
              "--content-firewall"]
    ports: ["8798:8799"]
    volumes: ["./config:/etc/acp:ro"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata: {}
  cpdata: {}

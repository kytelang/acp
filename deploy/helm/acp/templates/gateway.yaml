{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "acp.labels" . | nindent 4 }}
    app: {{ .Release.Name }}-gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-gateway }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-gateway }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["acp-gateway"]
          env:
            # The DSN (with its password) comes from a Secret, never from values or the pod args.
            - name: ACP_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.dsnSecret.name }}
                  key: {{ .Values.postgres.dsnSecret.key }}
          args:
            - "--addr"
            - "{{ .Values.gateway.addr }}"
            - "--policy"
            - "/etc/acp/policy.yaml"
            - "--upstream"
            - "{{ .Values.gateway.upstream }}"
            - "--budget-pg"
            - "$(ACP_PG_DSN)"
            {{- if .Values.gateway.contentFirewall }}
            - "--content-firewall"
            {{- end }}
          ports:
            - { name: http, containerPort: 8799 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8799 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8799 }
            periodSeconds: 15
          resources: {{ toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {{- include "acp.labels" . | nindent 4 }}
spec:
  selector: { app: {{ .Release.Name }}-gateway }
  ports:
    - { name: http, port: 8799, targetPort: 8799 }
{{- end }}

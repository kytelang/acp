apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }}-gateway }
  template:
    metadata:
      labels: { app: {{ .Release.Name }}-gateway }
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["acp-gateway"]
          args:
            - "--addr"
            - "{{ .Values.gateway.addr }}"
            - "--policy"
            - "/etc/acp/policy.yaml"
            - "--upstream"
            - "{{ .Values.gateway.upstream }}"
            - "--budget-pg"
            - "{{ .Values.postgres.dsn }}"
            {{- if .Values.gateway.contentFirewall }}
            - "--content-firewall"
            {{- end }}
          ports:
            - containerPort: 8799
          readinessProbe:
            httpGet: { path: /readyz, port: 8799 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8799 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector: { app: {{ .Release.Name }}-gateway }
  ports:
    - port: 8799
      targetPort: 8799

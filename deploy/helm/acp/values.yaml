image:
  repository: acp
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""

# Control plane (acp-server): holds the single-writer evidence ledger, so it is a StatefulSet with
# one replica and its own persistent volume. High availability (active plus standby with a leader
# lease) is tracked as P0-4 in docs/production-readiness.md and is not yet wired.
controlPlane:
  enabled: true
  # API listen address. Standardised on :8787 everywhere (compose, systemd, install-server) so the
  # console's hardcoded upstream expectation holds. The console UI itself serves on :8080 (distinct).
  addr: "0.0.0.0:8787"
  # Honest durability note (P0-3): the ledger is append-only and locally durable (SQLite WAL). It is
  # NOT replicated by this chart. Back it up (acp-cli ledger-backup or a volume snapshot) and set an
  # RPO you can live with. Do not claim replication you do not have.
  persistence:
    size: 10Gi
    storageClass: ""       # "" uses the cluster default
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  # In-cluster verified backup (P0-3). A sidecar periodically runs `acp-cli ledger-backup` to a second
  # persistent volume and verifies each copy. This is a second independent on-cluster copy, not offsite
  # durability: for a real RPO, ship the backup volume (or the ledger export) to object storage.
  backup:
    enabled: false
    intervalSeconds: 3600
    size: 10Gi

# Web console (read-only view over the control-plane API). It is a Kyte app, NOT one of the Rust
# binaries in image.repository, so it has its own image. Build acp-console with the Kyte toolchain
# and push it, then set console.image here.
# LIMITATION: the console binary hardcodes its control-plane upstream as http://127.0.0.1:8787
# (acp-console/src/main.ky). Across separate pods that address does not reach the control plane, so
# controlPlaneUrl below is only documentation of the intended target until the source is made
# configurable. Until then, run the console as a sidecar in the control-plane pod for a working URL.
console:
  enabled: false
  image:
    repository: acp-console
    tag: local
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  # Documented target once the hardcoded URL is made configurable (see LIMITATION above).
  controlPlaneUrl: "http://{{ .Release.Name }}-control-plane:8787"
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

gateway:
  enabled: true
  replicas: 2              # stateless; replicas share one budget through Postgres
  addr: "0.0.0.0:8799"
  upstream: "https://api.anthropic.com"
  contentFirewall: true
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "2", memory: "512Mi" }
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

postgres:
  # Shared state (budgets and tool-integrity pins). Point at a managed Postgres in production; this
  # chart does not deploy one. The DSN is a SECRET and is NOT stored in values: create it out of band
  #   kubectl create secret generic acp-postgres --from-literal=dsn='host=... user=... password=... dbname=acp'
  # and reference it here. The DSN is injected as an env var and expanded into the flag at runtime, so
  # the password never appears in the pod spec or in this file.
  dsnSecret:
    name: "acp-postgres"
    key: "dsn"

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: "acp.example.com"
  tls: []                  # e.g. [{ secretName: acp-tls, hosts: [acp.example.com] }]

networkPolicy:
  enabled: false           # when true, restrict ingress to the two services' ports only

ledgerKek:
  # Optional: encrypt evidence argument blobs at rest (P0-1). Create a Secret with the 64-hex KEK
  #   kubectl create secret generic acp-ledger-kek --from-literal=kek=$(openssl rand -hex 32)
  # and enable it here; it is mounted as a file and read via ACP_LEDGER_KEK_FILE, so the key never
  # appears in the pod spec or in this file.
  enabled: false
  secretName: "acp-ledger-kek"
  key: "kek"

hsm:
  # Optional: sign evidence on a PKCS#11 HSM instead of a file key (P0-2). The module .so/.dylib must
  # exist in the image or be mounted by the operator (vendor-specific). Slot/pin come from a Secret.
  #   kubectl create secret generic acp-hsm --from-literal=slot=<n> --from-literal=pin=<pin>
  enabled: false
  module: "/usr/lib/softhsm/libsofthsm2.so"
  label: "acp"
  secretName: "acp-hsm"        # keys: slot, pin

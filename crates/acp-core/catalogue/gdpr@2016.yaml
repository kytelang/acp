# GDPR, Regulation (EU) 2016/679.
# Framework type: statutory conformity (pass/fail against binding legal obligations for the processing of
# personal data). Nodes are faithful paraphrases with a citation, never verbatim regulation text.
slug: gdpr
label: GDPR
version: "2016"
framework_type: statutory_conformity
effective_date: "2018-05-25"
record_keeping_reference: "Art. 30 (records of processing)"

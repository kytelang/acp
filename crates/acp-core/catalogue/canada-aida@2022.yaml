# Canada Artificial Intelligence and Data Act (AIDA), part of Bill C-27 as introduced in 2022.
# Framework type: statutory_conformity, but PROPOSED: the Bill did not pass before Parliament was
# prorogued, so treat these as proposed duties on the person responsible for a high-impact system.
# Nodes are faithful paraphrases with a citation, never verbatim Bill text.

# NIST AI Risk Management Framework 1.0 (NIST AI 100-1).
# Framework type: voluntary standard (outcome-based subcategories across four functions: GOVERN, MAP,
# MEASURE, MANAGE). Nodes are faithful paraphrases of each subcategory outcome with a citation, never
# verbatim NIST text.
slug: nist-ai-rmf
label: NIST AI RMF
version: "1.0"
framework_type: standard
effective_date: "2023-01-26"
record_keeping_reference: "MEASURE (measurement and tracking)"
source: "NIST AI 100-1 (AI RMF 1.0)"
manifest:
  - "GOVERN 1"
  - "GOVERN 2"
  - "GOVERN 3"
  - "GOVERN 4"
  - "GOVERN 5"
  - "GOVERN 6"
  - "MAP 1"
  - "MAP 2"
  - "MAP 3"
  - "MAP 4"
  - "MAP 5"
  - "MEASURE 1"
  - "MEASURE 2"
  - "MEASURE 3"
  - "MEASURE 4"
  - "MANAGE 1"
  - "MANAGE 2"
  - "MANAGE 3"
  - "MANAGE 4"
controls:
  # --- GOVERN 1: policies, processes, procedures and practices ---
  - id: govern-1.1
    title: "Legal and regulatory requirements understood and managed"
    description: "Ensure the legal and regulatory requirements involving AI are understood, documented and actively managed for the organisation's context."
    required_evidence: "regulatory mapping and applicability record maintained in the control plane"
    path: ["GOVERN", "GOVERN 1"]
    reference: "GOVERN 1.1"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["eu-ai-act:art-8"]
    citation: "NIST AI 100-1, GOVERN 1.1"
  - id: govern-1.2
    title: "Trustworthy-AI characteristics integrated into policies"
    description: "Integrate the characteristics of trustworthy AI into organisational policies, processes, procedures and practices."
    required_evidence: "signed AI governance policy in force referencing trustworthiness characteristics"
    path: ["GOVERN", "GOVERN 1"]
    reference: "GOVERN 1.2"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["iso-42001:5.2"]
    citation: "NIST AI 100-1, GOVERN 1.2"
  - id: govern-1.3
    title: "Risk management process and risk tolerance established"
    description: "Establish processes, procedures and practices to determine the needed level of risk management activities based on the organisation's risk tolerance."
    required_evidence: "risk tolerance statement and tiered risk management procedure"
    path: ["GOVERN", "GOVERN 1"]
    reference: "GOVERN 1.3"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["eu-ai-act:art-9"]
    citation: "NIST AI 100-1, GOVERN 1.3"
  - id: govern-1.4
    title: "Risk management commitment and resourcing"
    description: "Ensure the risk management process and its outcomes are established through transparent policies, procedures and other controls based on organisational priorities."
    required_evidence: "documented risk management commitment with assigned resources and controls"
    path: ["GOVERN", "GOVERN 1"]
    reference: "GOVERN 1.4"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 1.4"
  - id: govern-1.5
    title: "Ongoing monitoring and periodic review of the risk process"
    description: "Plan and implement ongoing monitoring and periodic review of the risk management process, with clearly defined roles and responsibilities including determining periodicity."
    required_evidence: "review schedule and monitoring records for the risk management process"
    path: ["GOVERN", "GOVERN 1"]
    reference: "GOVERN 1.5"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: ledger
    citation: "NIST AI 100-1, GOVERN 1.5"
  - id: govern-1.6
    title: "Inventory of AI systems"
    description: "Establish and maintain an inventory of AI systems, resourced according to organisational risk priorities."
    required_evidence: "AI system inventory or registry maintained in the control plane"
    path: ["GOVERN", "GOVERN 1"]
    reference: "GOVERN 1.6"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 1.6"
  - id: govern-1.7
    title: "Decommissioning and phase-out of AI systems"
    description: "Establish processes for decommissioning and phasing out AI systems safely and in a manner that does not increase risk or diminish trustworthiness."
    required_evidence: "documented decommissioning procedure and retirement records"
    path: ["GOVERN", "GOVERN 1"]
    reference: "GOVERN 1.7"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 1.7"
  # --- GOVERN 2: accountability structures ---
  - id: govern-2.1
    title: "Roles, responsibilities and lines of communication"
    description: "Document and clearly define the roles, responsibilities and lines of communication related to mapping, measuring and managing AI risks."
    required_evidence: "RACI or accountability matrix for AI risk roles"
    path: ["GOVERN", "GOVERN 2"]
    reference: "GOVERN 2.1"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["iso-42001:5.3"]
    citation: "NIST AI 100-1, GOVERN 2.1"
  - id: govern-2.2
    title: "Training on trustworthy and responsible AI"
    description: "Ensure the organisation's personnel and partners receive AI risk management training to perform their duties consistent with related policies and procedures."
    required_evidence: "training records and completion attestations for relevant personnel"
    path: ["GOVERN", "GOVERN 2"]
    reference: "GOVERN 2.2"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: attestation
    citation: "NIST AI 100-1, GOVERN 2.2"
  - id: govern-2.3
    title: "Executive leadership accountability"
    description: "Ensure executive leadership takes responsibility for decisions about the risks associated with AI development and deployment."
    required_evidence: "signed leadership accountability statement and decision records"
    path: ["GOVERN", "GOVERN 2"]
    reference: "GOVERN 2.3"
    obligation_type: oversight
    roles: [provider]
    applicability: "always"
    assessment_method: attestation
    citation: "NIST AI 100-1, GOVERN 2.3"
  # --- GOVERN 3: workforce diversity, equity, inclusion and accessibility ---
  - id: govern-3.1
    title: "Diverse and inclusive decision-making"
    description: "Prioritise and integrate considerations of diversity, equity, inclusion and accessibility across the AI lifecycle in decision-making processes."
    required_evidence: "documented practices for diverse and inclusive AI decision-making"
    path: ["GOVERN", "GOVERN 3"]
    reference: "GOVERN 3.1"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 3.1"
  - id: govern-3.2
    title: "Human-AI teaming and oversight policies"
    description: "Define policies and procedures for human-AI configurations and the oversight of AI systems, including roles and responsibilities for human oversight."
    required_evidence: "human oversight policy defining teaming configurations and intervention roles"
    path: ["GOVERN", "GOVERN 3"]
    reference: "GOVERN 3.2"
    obligation_type: oversight
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["eu-ai-act:art-14"]
    citation: "NIST AI 100-1, GOVERN 3.2"
  # --- GOVERN 4: organisational culture of risk awareness ---
  - id: govern-4.1
    title: "Culture of critical thinking and safety-first mindset"
    description: "Foster a culture that encourages critical thinking and a safety-first mindset in the design, development, deployment and use of AI to minimise potential negative impacts."
    required_evidence: "documented safety culture practices and awareness activities"
    path: ["GOVERN", "GOVERN 4"]
    reference: "GOVERN 4.1"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: attestation
    citation: "NIST AI 100-1, GOVERN 4.1"
  - id: govern-4.2
    title: "Documenting and communicating risks and impacts"
    description: "Document and communicate the risks and potential impacts of the AI technology, and the organisation's process for the design, development, deployment, evaluation and use of AI systems."
    required_evidence: "impact documentation and communication records for stakeholders"
    path: ["GOVERN", "GOVERN 4"]
    reference: "GOVERN 4.2"
    obligation_type: transparency
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 4.2"
  - id: govern-4.3
    title: "Testing, incident identification and information sharing"
    description: "Establish organisational practices for testing, identification of incidents and information sharing regarding AI system risks and negative impacts."
    required_evidence: "incident and information-sharing procedure with recorded outcomes"
    path: ["GOVERN", "GOVERN 4"]
    reference: "GOVERN 4.3"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: ledger
    crosswalk: ["eu-ai-act:art-73"]
    citation: "NIST AI 100-1, GOVERN 4.3"
  # --- GOVERN 5: engagement with relevant AI actors ---
  - id: govern-5.1
    title: "Feedback collection from external stakeholders"
    description: "Establish processes for collecting, considering, prioritising and integrating feedback from those external to the team that developed or deployed the AI system."
    required_evidence: "documented external feedback channel and triage records"
    path: ["GOVERN", "GOVERN 5"]
    reference: "GOVERN 5.1"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 5.1"
  - id: govern-5.2
    title: "Mechanisms for stakeholder engagement"
    description: "Establish mechanisms to enable regular engagement with relevant AI actors and to incorporate feedback into AI system design and implementation."
    required_evidence: "stakeholder engagement plan with participation records"
    path: ["GOVERN", "GOVERN 5"]
    reference: "GOVERN 5.2"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 5.2"
  # --- GOVERN 6: third-party software, data and supply-chain risk ---
  - id: govern-6.1
    title: "Third-party AI risk policies and procedures"
    description: "Establish policies and procedures to address AI risks associated with third-party software and data and other supply-chain issues."
    required_evidence: "third-party and supply-chain risk policy with vendor risk records"
    path: ["GOVERN", "GOVERN 6"]
    reference: "GOVERN 6.1"
    obligation_type: govern
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["iso-27001:A.5.19"]
    citation: "NIST AI 100-1, GOVERN 6.1"
  - id: govern-6.2
    title: "Contingency for high-risk third-party failures"
    description: "Establish contingency processes to handle failures or incidents in third-party data or AI systems that are deemed to be high-risk."
    required_evidence: "contingency and fallback plan for third-party AI failures"
    path: ["GOVERN", "GOVERN 6"]
    reference: "GOVERN 6.2"
    obligation_type: process
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, GOVERN 6.2"
  # --- MAP 1: context establishment and understanding ---
  - id: map-1.1
    title: "Intended purpose, context and expectations documented"
    description: "Understand and document the intended purposes, potentially beneficial uses, context-specific laws, norms and expectations, and prospective settings in which the AI system will be deployed."

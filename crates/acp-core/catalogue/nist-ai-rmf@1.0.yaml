    reference: "MAP 1.3"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 1.3"
  - id: map-1.4
    title: "Business need and requirements determined"
    description: "Understand and document the organisation's business need for the AI system, its capabilities, targeted usage, goals and expected benefits and costs compared with the status quo."
    required_evidence: "requirements and cost-benefit analysis record"
    path: ["MAP", "MAP 1"]
    reference: "MAP 1.4"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 1.4"
  - id: map-1.5
    title: "Risk tolerances determined and documented"
    description: "Determine and document organisational risk tolerances for the AI system informed by the organisation's mission, priorities, resources and legal or regulatory requirements."
    required_evidence: "documented risk tolerance for the specific AI system"
    path: ["MAP", "MAP 1"]
    reference: "MAP 1.5"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 1.5"
  - id: map-1.6
    title: "System requirements elicited from relevant actors"
    description: "Elicit, understand and document system requirements, aligned with expectations from relevant AI actors, and evaluate them against the intended purpose."
    required_evidence: "requirements specification traced to stakeholder expectations"
    path: ["MAP", "MAP 1"]
    reference: "MAP 1.6"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 1.6"
  # --- MAP 2: categorisation of the AI system ---
  - id: map-2.1
    title: "Task and method definitions documented"
    description: "Define and document the specific tasks and methods used to implement the tasks that the AI system will support."
    required_evidence: "task and method definition record for the AI system"
    path: ["MAP", "MAP 2"]
    reference: "MAP 2.1"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 2.1"
  - id: map-2.2
    title: "Knowledge limits and human-AI interaction documented"
    description: "Document information about the AI system's knowledge limits and how output may be used and overseen by humans, so it can be understood and used appropriately."
    required_evidence: "documentation of knowledge limits and human oversight touchpoints"
    path: ["MAP", "MAP 2"]
    reference: "MAP 2.2"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["eu-ai-act:art-13"]
    citation: "NIST AI 100-1, MAP 2.2"
  - id: map-2.3
    title: "Scientific integrity and TEVV considerations documented"
    description: "Identify and document the scientific integrity and test, evaluation, validation and verification (TEVV) considerations, including those related to experimental design and data quality."

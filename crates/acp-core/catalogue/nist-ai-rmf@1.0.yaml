    path: ["MAP", "MAP 1"]
    reference: "MAP 1.1"
    obligation_type: document
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["eu-ai-act:art-11"]
    citation: "NIST AI 100-1, MAP 1.1"
  - id: map-1.2
    title: "Interdisciplinary AI actors and competencies"
    description: "Establish and maintain interdisciplinary AI actors, competencies, skills and capacities, and demographic and disciplinary diversity, for mapping, measuring and managing AI risks."
    required_evidence: "team composition and competency records covering interdisciplinary perspectives"
    path: ["MAP", "MAP 1"]
    reference: "MAP 1.2"
    obligation_type: govern
    roles: [provider]
    applicability: "always"
    assessment_method: attestation
    citation: "NIST AI 100-1, MAP 1.2"
  - id: map-1.3
    title: "Mission, goals and business value defined"
    description: "Understand and document the organisation's mission and relevant goals for the AI technology, along with the business value or context of use."

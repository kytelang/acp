    path: ["MAP", "MAP 2"]
    reference: "MAP 2.3"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 2.3"
  # --- MAP 3: benefits and costs mapped ---
  - id: map-3.1
    title: "Potential benefits examined and documented"
    description: "Examine and document the potential benefits of the AI system's functionality and performance compared with the status quo of the intended context of use."
    required_evidence: "benefit assessment record for the intended use"
    path: ["MAP", "MAP 3"]
    reference: "MAP 3.1"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 3.1"
  - id: map-3.2
    title: "Potential costs and negative impacts documented"
    description: "Examine and document the potential costs, including non-monetary costs, that result from expected or realised errors or system functionality and trustworthiness."
    required_evidence: "impact and cost analysis including non-monetary harms"
    path: ["MAP", "MAP 3"]
    reference: "MAP 3.2"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 3.2"
  - id: map-3.3
    title: "Application scope specified"
    description: "Define and document the targeted application scope, taking into account the specifics of the intended context of deployment and any known constraints."
    required_evidence: "documented application scope and boundary constraints"
    path: ["MAP", "MAP 3"]
    reference: "MAP 3.3"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 3.3"
  - id: map-3.4
    title: "Operator and practitioner proficiency defined"
    description: "Define and document processes to operate and monitor the AI system, and the proficiency and competency required of the operators and practitioners who oversee it."
    required_evidence: "operating procedures and operator proficiency requirements"
    path: ["MAP", "MAP 3"]
    reference: "MAP 3.4"
    obligation_type: process
    roles: [deployer]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 3.4"
  - id: map-3.5
    title: "Human oversight processes defined and assessed"
    description: "Define, assess and document processes for human oversight, informed by organisational policies and the competencies and capacities of the humans providing the oversight."
    required_evidence: "human oversight design record with approval and override procedures"
    path: ["MAP", "MAP 3"]
    reference: "MAP 3.5"
    obligation_type: oversight
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: ledger
    crosswalk: ["eu-ai-act:art-14"]
    citation: "NIST AI 100-1, MAP 3.5"
  # --- MAP 4: risks and benefits mapped for all components including third parties ---
  - id: map-4.1
    title: "Approaches for mapping third-party risks"
    description: "Identify and document approaches used to map AI technology and legal risks of its components, including the use of third-party data or software."
    required_evidence: "third-party component and legal-risk mapping record"
    path: ["MAP", "MAP 4"]
    reference: "MAP 4.1"
    obligation_type: document
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["nist-ai-rmf:GOVERN-6.1"]
    citation: "NIST AI 100-1, MAP 4.1"
  - id: map-4.2
    title: "Internal risk controls for components mapped"
    description: "Identify and document internal risk controls for the AI system components, including third-party components, and the risks they are intended to address."
    required_evidence: "control mapping for each system component and its residual risk"
    path: ["MAP", "MAP 4"]
    reference: "MAP 4.2"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 4.2"
  # --- MAP 5: impacts to individuals, groups, communities and society characterised ---
  - id: map-5.1
    title: "Likelihood and magnitude of impacts characterised"
    description: "Identify and document the likelihood and magnitude of each impact, both potential benefit and negative, to individuals, groups, communities, organisations and society, based on expected use, past uses, public feedback or other data."
    required_evidence: "impact characterisation record with likelihood and severity ratings"
    path: ["MAP", "MAP 5"]
    reference: "MAP 5.1"
    obligation_type: document
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: artefact
    crosswalk: ["eu-ai-act:art-27"]
    citation: "NIST AI 100-1, MAP 5.1"
  - id: map-5.2
    title: "Practices for engagement and feedback on impacts"
    description: "Establish and document practices and personnel for supporting regular engagement with relevant AI actors and integrating feedback about positive, negative and unanticipated impacts."
    required_evidence: "documented impact-feedback engagement practice with records"
    path: ["MAP", "MAP 5"]
    reference: "MAP 5.2"
    obligation_type: process
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MAP 5.2"
  # --- MEASURE 1: appropriate methods and metrics identified and applied ---
  - id: measure-1.1
    title: "Metrics and methods selected and documented"
    description: "Identify and document the approaches and metrics for measurement of AI risks enumerated during mapping, and note risks or trustworthiness characteristics that are difficult to measure."
    required_evidence: "measurement plan listing metrics, methods and known measurement gaps"
    path: ["MEASURE", "MEASURE 1"]
    reference: "MEASURE 1.1"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MEASURE 1.1"
  - id: measure-1.2
    title: "Appropriateness and effectiveness of metrics evaluated"
    description: "Regularly assess and update the appropriateness of the metrics and effectiveness of the existing controls, and consider alternatives where they are insufficient."
    required_evidence: "periodic review record of metric appropriateness and control effectiveness"
    path: ["MEASURE", "MEASURE 1"]
    reference: "MEASURE 1.2"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: ledger
    citation: "NIST AI 100-1, MEASURE 1.2"
  - id: measure-1.3
    title: "Independent assessment and internal expertise"
    description: "Involve independent assessors and domain experts, including those external to the development team, in measurement and tracking, and consult them on limits of the measurement approach."
    required_evidence: "independent review or expert consultation records"
    path: ["MEASURE", "MEASURE 1"]
    reference: "MEASURE 1.3"
    obligation_type: oversight
    roles: [provider]
    applicability: "always"
    assessment_method: attestation
    citation: "NIST AI 100-1, MEASURE 1.3"
  # --- MEASURE 2: systems evaluated for trustworthy characteristics ---
  - id: measure-2.1
    title: "Test sets, metrics and details documented"
    description: "Document the test sets, metrics and details about the tools used during test, evaluation, validation and verification, and the frequency with which they are applied."
    required_evidence: "TEVV documentation covering datasets, tooling and cadence"
    path: ["MEASURE", "MEASURE 2"]
    reference: "MEASURE 2.1"
    obligation_type: document
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MEASURE 2.1"
  - id: measure-2.2
    title: "Human subject evaluation follows appropriate protocols"
    description: "Evaluate AI systems for human factors, and where human subjects are involved, apply representativeness, informed consent and other protocols consistent with applicable requirements."
    required_evidence: "human-factors evaluation record with consent and protocol documentation"
    path: ["MEASURE", "MEASURE 2"]
    reference: "MEASURE 2.2"
    obligation_type: process
    roles: [provider]
    applicability: "always"
    assessment_method: artefact
    citation: "NIST AI 100-1, MEASURE 2.2"
  - id: measure-2.3
    title: "System performance and validity demonstrated"
    description: "Measure and document AI system performance and assurance criteria demonstrating that the system performs as intended in conditions similar to deployment."
    required_evidence: "performance and validity test results across representative conditions"
    path: ["MEASURE", "MEASURE 2"]
    reference: "MEASURE 2.3"
    obligation_type: technical
    roles: [provider]
    applicability: "always"
    assessment_method: test
    crosswalk: ["eu-ai-act:art-15"]
    citation: "NIST AI 100-1, MEASURE 2.3"
  - id: measure-2.4
    title: "Deployment monitoring for functionality and behaviour"
    description: "Monitor the AI system in production, including for its functionality and behaviour, and put mechanisms in place to detect changes that indicate a degradation of trustworthiness."
    required_evidence: "production monitoring telemetry with drift and degradation alerts"
    path: ["MEASURE", "MEASURE 2"]
    reference: "MEASURE 2.4"
    obligation_type: technical
    roles: [provider, deployer]
    applicability: "always"
    assessment_method: ledger
    crosswalk: ["eu-ai-act:art-72"]
    citation: "NIST AI 100-1, MEASURE 2.4"
  - id: measure-2.5
    title: "Validity and reliability demonstrated and documented"
    description: "Demonstrate and document that the AI system is valid and reliable, and identify the conditions under which the system fails or performs poorly."
    required_evidence: "validity and reliability test results with documented failure conditions"
    path: ["MEASURE", "MEASURE 2"]
    reference: "MEASURE 2.5"
    obligation_type: technical
    roles: [provider]
    applicability: "always"
    assessment_method: test
    crosswalk: ["eu-ai-act:art-15"]
    citation: "NIST AI 100-1, MEASURE 2.5"
  - id: measure-2.6
    title: "Safety risks evaluated"
    description: "Evaluate the AI system for safety risks, including those that may arise from real-world deployment, and demonstrate it is safe under conditions of foreseeable use and misuse."
    required_evidence: "safety evaluation record covering foreseeable use and misuse"

# ISO/IEC 42001:2023, Artificial intelligence management system (AIMS).
# Framework type: management-system standard. Clauses 4 to 10 are the management-system requirements;
# Annex A (A.2 to A.10) is the reference set of controls. Nodes are faithful paraphrases with a citation,
# never verbatim standard text.
slug: iso-42001
label: ISO/IEC 42001
version: "2023"
framework_type: standard
effective_date: "2023-12-01"
record_keeping_reference: "Clause 9 (performance evaluation)"
source: "ISO/IEC 42001:2023"

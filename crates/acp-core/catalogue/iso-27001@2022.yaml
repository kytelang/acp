# ISO/IEC 27001:2022 - Information security management systems - Requirements.
# Framework type: standard (management-system clauses 4-10, assessed for conformity, plus the 93 Annex A
# controls across four themes). Nodes are faithful paraphrases with a citation, never verbatim ISO text.
slug: iso-27001
label: ISO/IEC 27001
version: "2022"
framework_type: standard
effective_date: "2022-10-25"
record_keeping_reference: "A.8.15 (logging)"
source: "ISO/IEC 27001:2022"
manifest:
  - "4"
  - "5"
  - "6"
  - "7"
  - "8"
  - "9"
  - "10"
  - "A.5"
  - "A.6"
  - "A.7"
  - "A.8"
controls:
  # --- Management system clauses 4-10 ---
  - id: clause-4.1
    title: "Understanding the organisation and its context"
    description: "Determine the external and internal issues relevant to the purpose of the organisation that affect the ability of the information security management system to achieve its intended outcomes."
    required_evidence: "context analysis record identifying internal and external issues"
    path: ["Clauses", "4 Context of the organisation"]
    reference: "4.1"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 4.1"
  - id: clause-4.2
    title: "Understanding the needs and expectations of interested parties"
    description: "Identify the interested parties relevant to the ISMS, their relevant requirements, and which of those requirements will be addressed through the management system."
    required_evidence: "register of interested parties and their information security requirements"
    path: ["Clauses", "4 Context of the organisation"]
    reference: "4.2"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 4.2"
  - id: clause-4.3
    title: "Determining the scope of the information security management system"
    description: "Establish the boundaries and applicability of the ISMS and document it, taking account of the issues, requirements and interfaces with other organisations."
    required_evidence: "documented ISMS scope statement"
    path: ["Clauses", "4 Context of the organisation"]
    reference: "4.3"
    obligation_type: document
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 4.3"
  - id: clause-4.4
    title: "Information security management system"
    description: "Establish, implement, maintain and continually improve the ISMS, including the processes needed and their interactions, in line with the standard."
    required_evidence: "ISMS process documentation and interaction map"
    path: ["Clauses", "4 Context of the organisation"]
    reference: "4.4"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 4.4"
  - id: clause-5.1
    title: "Leadership and commitment"
    description: "Top management demonstrates leadership and commitment to the ISMS by ensuring policy and objectives are set, resources are available, and the system is integrated into business processes."
    required_evidence: "management commitment record; leadership sign-off"
    path: ["Clauses", "5 Leadership"]
    reference: "5.1"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: attestation
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 5.1"
  - id: clause-5.2
    title: "Policy"
    description: "Top management establishes an information security policy that fits the organisation's purpose, includes objectives or a framework for them, and commits to satisfying requirements and continual improvement."
    required_evidence: "approved information security policy in force"
    path: ["Clauses", "5 Leadership"]
    reference: "5.2"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 5.2"
  - id: clause-5.3
    title: "Organisational roles, responsibilities and authorities"
    description: "Top management assigns and communicates the responsibilities and authorities for roles relevant to information security, including conformance reporting."
    required_evidence: "documented ISMS roles and responsibilities matrix"
    path: ["Clauses", "5 Leadership"]
    reference: "5.3"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 5.3"
  - id: clause-6.1
    title: "Actions to address risks and opportunities"
    description: "Plan actions to address the risks and opportunities determined from the context and interested parties, and integrate them into the ISMS processes and evaluation."

    path: ["Clauses", "6 Planning"]
    reference: "6.1"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 6.1"
  - id: clause-6.2
    title: "Information security objectives and planning to achieve them"
    description: "Set measurable information security objectives at relevant functions and levels, and plan what will be done, with what resources, by whom, and how results are evaluated."
    required_evidence: "documented information security objectives and plans"
    path: ["Clauses", "6 Planning"]
    reference: "6.2"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 6.2"
  - id: clause-6.3
    title: "Planning of changes"
    description: "Carry out changes to the ISMS in a planned manner."
    required_evidence: "change plans for the ISMS"
    path: ["Clauses", "6 Planning"]
    reference: "6.3"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 6.3"
  - id: clause-7.1
    title: "Resources"
    description: "Determine and provide the resources needed for the establishment, implementation, maintenance and continual improvement of the ISMS."
    required_evidence: "resource allocation records for the ISMS"
    path: ["Clauses", "7 Support"]
    reference: "7.1"
    obligation_type: govern
    roles: []
    applicability: "always"
    assessment_method: attestation
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 7.1"
  - id: clause-7.2
    title: "Competence"
    description: "Determine the necessary competence of people affecting information security performance, ensure they are competent, and retain evidence of competence."
    required_evidence: "competence records; training and qualification evidence"
    path: ["Clauses", "7 Support"]
    reference: "7.2"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 7.2"
  - id: clause-7.3
    title: "Awareness"
    description: "Ensure persons doing work under the organisation's control are aware of the information security policy, their contribution, and the implications of non-conformance."
    required_evidence: "security awareness programme records"
    path: ["Clauses", "7 Support"]
    reference: "7.3"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: attestation
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 7.3"
  - id: clause-7.4
    title: "Communication"
    description: "Determine the internal and external communications relevant to the ISMS, including what, when, with whom, and how communication takes place."
    required_evidence: "communication plan for the ISMS"
    path: ["Clauses", "7 Support"]
    reference: "7.4"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 7.4"
  - id: clause-7.5
    title: "Documented information"
    description: "Create, control and make available the documented information required by the standard and needed for ISMS effectiveness, with control over distribution, access, versioning and retention."
    required_evidence: "controlled document register with version and access control"
    path: ["Clauses", "7 Support"]
    reference: "7.5"
    obligation_type: document
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 7.5"
  - id: clause-8.1
    title: "Operational planning and control"
    description: "Plan, implement and control the processes needed to meet requirements and to carry out the risk treatment actions, keeping documented information to have confidence processes ran as planned."
    required_evidence: "operational control records; process execution evidence"
    path: ["Clauses", "8 Operation"]
    reference: "8.1"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 8.1"
  - id: clause-8.2
    title: "Information security risk assessment"
    description: "Perform information security risk assessments at planned intervals and when significant changes occur, and retain documented results."
    required_evidence: "risk assessment results retained at planned intervals"
    path: ["Clauses", "8 Operation"]
    reference: "8.2"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 8.2"
  - id: clause-8.3
    title: "Information security risk treatment"
    description: "Implement the information security risk treatment plan and retain documented information of the results."
    required_evidence: "risk treatment plan execution records"
    path: ["Clauses", "8 Operation"]
    reference: "8.3"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 8.3"
  - id: clause-9.1
    title: "Monitoring, measurement, analysis and evaluation"
    description: "Evaluate information security performance and the effectiveness of the ISMS by determining what to monitor and measure, the methods, and when results are analysed and evaluated."
    required_evidence: "monitoring and measurement results with analysis"
    path: ["Clauses", "9 Performance evaluation"]
    reference: "9.1"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 9.1"
  - id: clause-9.2
    title: "Internal audit"
    description: "Conduct internal audits at planned intervals to check the ISMS conforms to the organisation's own requirements and the standard, and is effectively implemented."
    required_evidence: "internal audit programme and audit reports"
    path: ["Clauses", "9 Performance evaluation"]
    reference: "9.2"
    obligation_type: oversight
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 9.2"
  - id: clause-9.3
    title: "Management review"
    description: "Top management reviews the ISMS at planned intervals, considering the defined inputs, and records decisions on improvement and change."
    required_evidence: "management review minutes and outputs"
    path: ["Clauses", "9 Performance evaluation"]
    reference: "9.3"
    obligation_type: oversight
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 9.3"
  - id: clause-10.1
    title: "Continual improvement"
    description: "Continually improve the suitability, adequacy and effectiveness of the ISMS."
    required_evidence: "continual improvement records"
    path: ["Clauses", "10 Improvement"]
    reference: "10.1"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 10.1"
  - id: clause-10.2
    title: "Nonconformity and corrective action"
    description: "React to nonconformities, evaluate the need to eliminate causes, implement corrective action, and retain documented information on the nature and outcome."
    required_evidence: "nonconformity and corrective-action log"
    path: ["Clauses", "10 Improvement"]
    reference: "10.2"
    obligation_type: process
    roles: []
    applicability: "always"
    assessment_method: artefact
    crosswalk: []
    citation: "ISO/IEC 27001:2022, 10.2"

    assessment_method: artefact
    citation: "Regulation (EU) 2024/1689, Art. 50(1)"
  - id: art-50-2
    title: "Transparency: marking synthetic content"
    description: "Mark AI-generated or manipulated audio, image, video or text as artificially generated in a machine-readable way."
    required_evidence: "content-marking mechanism evidence"
    path: ["Chapter IV", "Article 50"]
    reference: "Art. 50(2)"
    obligation_type: transparency

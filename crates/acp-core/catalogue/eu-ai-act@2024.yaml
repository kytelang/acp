  # --- Chapter III Section 5: conformity assessment, certificates, registration (Art. 43-49) ---
  - id: art-43
    title: "Conformity assessment"
    description: "Undergo the applicable conformity assessment procedure before placing on the market, internal control or notified-body involvement per the Annex."
    required_evidence: "conformity assessment record; notified-body certificate where required"

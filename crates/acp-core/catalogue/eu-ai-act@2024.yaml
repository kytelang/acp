  # --- Chapter IV: transparency obligations (Art. 50) ---
  - id: art-50-1
    title: "Transparency: AI interacting with people"
    description: "Inform natural persons that they are interacting with an AI system, unless it is obvious from the context."
    required_evidence: "user-facing AI-interaction disclosure"
    path: ["Chapter IV", "Article 50"]
    reference: "Art. 50(1)"
    obligation_type: transparency
    roles: [provider, deployer]

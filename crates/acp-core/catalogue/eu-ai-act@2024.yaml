    applicability: "asset_type=gpai"
    assessment_method: artefact
    citation: "Regulation (EU) 2024/1689, Art. 53"
  - id: art-55
    title: "Obligations of GPAI models with systemic risk"
    description: "Providers of GPAI models with systemic risk perform model evaluations and adversarial testing, assess and mitigate systemic risks, track and report serious incidents, and ensure cybersecurity."
    required_evidence: "model evaluation and red-team results; systemic-risk assessment; incident tracking; cybersecurity measures"
    path: ["Chapter V", "Section 3", "Article 55"]
    reference: "Art. 55"
    obligation_type: process
    roles: [provider]
    applicability: "asset_type=gpai_systemic"
    assessment_method: test
    citation: "Regulation (EU) 2024/1689, Art. 55"
  # --- Chapter IX: post-market monitoring and incident reporting (Art. 72, 73) ---
  - id: art-72
    title: "Post-market monitoring"
    description: "Establish and document a post-market monitoring system proportionate to the risks, collecting and analysing performance data across the system's lifetime."

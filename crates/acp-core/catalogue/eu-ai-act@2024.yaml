  # --- Chapter V: general-purpose AI models (Art. 53, 55) ---
  - id: art-53
    title: "Obligations of GPAI model providers"
    description: "Providers of general-purpose AI models keep technical documentation, provide information to downstream providers, put a copyright policy in place, and publish a training-content summary."
    required_evidence: "GPAI technical documentation; downstream information package; copyright policy; training-data summary"
    path: ["Chapter V", "Section 2", "Article 53"]
    reference: "Art. 53"
    obligation_type: document

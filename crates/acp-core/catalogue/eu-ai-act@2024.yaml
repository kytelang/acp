  - id: art-47
    title: "EU declaration of conformity"
    description: "Draw up a written, machine-readable EU declaration of conformity, keep it for ten years, and provide it to authorities on request."
    required_evidence: "signed EU declaration of conformity"
    path: ["Chapter III", "Section 5", "Article 47"]
    reference: "Art. 47"
    obligation_type: document

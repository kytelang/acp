controls:
  # --- Chapter II: prohibited practices (Art. 5) ---
  - id: art-5-a
    title: "Prohibited: subliminal or manipulative techniques"
    description: "Do not place, put into service or use AI that deploys subliminal, purposefully manipulative or deceptive techniques that materially distort behaviour and cause or are likely to cause significant harm."
    required_evidence: "attestation the system uses no manipulative or deceptive techniques; design review record"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(a)"
    obligation_type: prohibition
    roles: [provider, deployer]
    assessment_method: attestation
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(a)"
  - id: art-5-b
    title: "Prohibited: exploiting vulnerabilities"
    description: "Do not exploit vulnerabilities due to age, disability or a specific social or economic situation to materially distort behaviour in a way that causes or is likely to cause significant harm."
    required_evidence: "attestation and design review that no vulnerable-group exploitation exists"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(b)"
    obligation_type: prohibition
    roles: [provider, deployer]
    assessment_method: attestation
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(b)"
  - id: art-5-c
    title: "Prohibited: social scoring"
    description: "Do not use AI for social scoring of natural persons leading to detrimental or unfavourable treatment that is unjustified or disproportionate."
    required_evidence: "attestation no social scoring is performed"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(c)"
    obligation_type: prohibition
    roles: [provider, deployer]
    assessment_method: attestation
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(c)"
  - id: art-5-d
    title: "Prohibited: individual crime-risk prediction from profiling"
    description: "Do not use AI to assess or predict the risk of a natural person committing a crime based solely on profiling or personality traits, save for supporting a human assessment grounded in objective facts."
    required_evidence: "attestation no profiling-only crime prediction is performed"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(d)"
    obligation_type: prohibition
    roles: [provider, deployer]
    assessment_method: attestation
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(d)"
  - id: art-5-e
    title: "Prohibited: untargeted facial-image scraping"
    description: "Do not create or expand facial-recognition databases through untargeted scraping of facial images from the internet or CCTV."
    required_evidence: "attestation no untargeted facial-image scraping is performed"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(e)"
    obligation_type: prohibition
    roles: [provider, deployer]
    assessment_method: attestation
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(e)"
  - id: art-5-f
    title: "Prohibited: emotion inference at work or in education"
    description: "Do not use AI to infer emotions of a person in the workplace or education institutions, except for medical or safety reasons."
    required_evidence: "attestation no workplace or education emotion inference is performed"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(f)"
    obligation_type: prohibition
    roles: [provider, deployer]
    assessment_method: attestation
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(f)"
  - id: art-5-g
    title: "Prohibited: biometric categorisation for sensitive traits"
    description: "Do not use biometric categorisation that infers race, political opinions, trade-union membership, religious or philosophical beliefs, sex life or sexual orientation, save for lawful labelling or filtering of lawfully acquired datasets."
    required_evidence: "attestation no sensitive-trait biometric categorisation is performed"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(g)"
    obligation_type: prohibition
    roles: [provider, deployer]
    assessment_method: attestation
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(g)"
  - id: art-5-h
    title: "Prohibited: real-time remote biometric identification in public (law enforcement)"
    description: "Do not use real-time remote biometric identification in publicly accessible spaces for law enforcement, save for the narrowly defined exceptions and authorisations set out in the Act."
    required_evidence: "attestation, and where an exception is relied on, the judicial or administrative authorisation record"
    path: ["Chapter II", "Article 5"]
    reference: "Art. 5(1)(h)"
    obligation_type: prohibition
    roles: [deployer]
    citation: "Regulation (EU) 2024/1689, Art. 5(1)(h)"
    assessment_method: attestation
  # --- Chapter III Section 1: high-risk classification (Art. 6 + Annex III) ---
  - id: art-6
    title: "High-risk classification rules"
    description: "Determine whether the system is high-risk: a safety component or product under Annex I, or an Annex III use case, applying the Art. 6(3) derogation only with a documented justification."
    required_evidence: "classification record with justification; risk tiering assessment"
    path: ["Chapter III", "Section 1", "Article 6"]
    reference: "Art. 6"
    obligation_type: govern
    roles: [provider]
    assessment_method: artefact
    citation: "Regulation (EU) 2024/1689, Art. 6"
  - id: annex-iii-1

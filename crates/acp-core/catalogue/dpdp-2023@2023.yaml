# India Digital Personal Data Protection Act, 2023.
# Framework type: statutory conformity (pass/fail against binding legal obligations for the processing of
# digital personal data). Nodes are faithful paraphrases with a citation, never verbatim statutory text.
slug: dpdp-2023
label: India DPDP Act 2023
version: "2023"
framework_type: statutory_conformity
effective_date: "2023-08-11"
record_keeping_reference: "s8 (data fiduciary obligations)"
source: "Digital Personal Data Protection Act, 2023 (India)"

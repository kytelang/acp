[package]
name = "acp-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Agent Control Plane: control service - approval inbox, policy endpoint, verify, reporting."

[dependencies]
getrandom.workspace = true
acp-hsm = { path = "../acp-hsm" }
tracing.workspace = true
reqwest.workspace = true
acp-core = { path = "../acp-core" }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
sqlx.workspace = true
serde.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = "0.5"
tokio = { workspace = true }
axum = { workspace = true }
maud = { workspace = true }
serde_json.workspace = true
hex.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true }

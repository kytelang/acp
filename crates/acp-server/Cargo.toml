[package]
name = "acp-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Agent Control Plane: control service - approval inbox, policy endpoint, verify, reporting."

[dependencies]
acp-obs = { path = "../acp-obs" }
tracing.workspace = true
reqwest.workspace = true
acp-core = { path = "../acp-core" }
acp-auth = { path = "../acp-auth" }
acp-mtls = { path = "../acp-mtls" }
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = "0.5"
acp-policy = { path = "../acp-policy" }
acp-registry = { path = "../acp-registry" }
acp-ledger = { path = "../acp-ledger" }
acp-approvals = { path = "../acp-approvals" }
tokio = { workspace = true }
axum = { workspace = true }
maud = { workspace = true }
serde_json.workspace = true
hex.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio = { workspace = true }

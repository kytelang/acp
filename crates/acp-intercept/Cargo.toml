[package]
name = "acp-intercept"
version = "0.0.0"
edition = "2021"
description = "Agent Control Plane: configuration-driven forward proxy. Matches destinations against the endpoint registry and governs or tunnels per rule."

[lib]
name = "acp_intercept"
path = "src/lib.rs"

[[bin]]
name = "acp-intercept"
path = "src/main.rs"

[dependencies]
acp-core = { path = "../acp-core" }
acp-ledger = { path = "../acp-ledger" }
tokio = { workspace = true }
reqwest.workspace = true
serde_json.workspace = true
hex.workspace = true

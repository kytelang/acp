[package]
name = "acp-proxy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Agent Control Plane: transparent MCP interception proxy (stdio + HTTP)."

[lib]
name = "acp_proxy"
path = "src/lib.rs"

[[bin]]
name = "acp-proxy"
path = "src/main.rs"

[[bin]]
name = "mock-mcp-server"
path = "src/bin/mock_mcp_server.rs"

[dependencies]
acp-hsm = { path = "../acp-hsm" }
tracing.workspace = true
hex.workspace = true
acp-core = { path = "../acp-core" }
acp-pgstate = { path = "../acp-pgstate" }
acp-jsonrpc = { path = "../acp-jsonrpc" }
tokio = { workspace = true }
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true }

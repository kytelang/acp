[package]
name = "acp-proxy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Agent Control Plane: transparent MCP interception proxy (stdio + HTTP)."

[[bin]]
name = "acp-proxy"
path = "src/main.rs"

[[bin]]
name = "mock-mcp-server"
path = "src/bin/mock_mcp_server.rs"

[dependencies]
acp-core = { path = "../acp-core" }
acp-jsonrpc = { path = "../acp-jsonrpc" }
acp-policy = { path = "../acp-policy" }
tokio = { workspace = true }
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true }

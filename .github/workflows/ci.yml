name: ci
on: [push, pull_request]
jobs:
  build-test:
    # Target-OS verification matrix: the enforcement core must build and pass on every OS a
    # customer might self-host on (Linux, macOS, Windows).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --all-targets
      - name: test
        run: cargo test --workspace
      - name: test-count gate (fail if tests were dropped)
        run: bash scripts/test-count-gate.sh
      - name: transparency (M1 golden)
        if: matrix.os != 'windows-latest'
        run: make test-transparency
      - name: shakedown + pentest (resilience + security self-test)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/pentest.sh && bash scripts/shakedown.sh
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-audit
        run: cargo install cargo-audit --locked && cargo audit

  db-tests:
    # Run the Postgres-backed tests for the config-driven control-plane store and the shared-state
    # crates against a real database (they skip when no DB is reachable, so this is where they run).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Create a non-superuser role for the RLS test
        env: { PGPASSWORD: postgres }
        run: |
          psql -h localhost -U postgres -d acp -c "CREATE ROLE acp_app LOGIN PASSWORD 'apppw' NOSUPERUSER;"
          psql -h localhost -U postgres -d acp -c "GRANT ALL ON SCHEMA public TO acp_app; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO acp_app;"
      - name: control-plane store (acp_server::store) against Postgres
        env:
          ACP_CP_PG_URL: postgres://postgres:postgres@localhost/acp
        run: cargo test -p acp-server store::
      - name: shared budgets/pins (acp_core::pgstate) against Postgres
        env:
          ACP_PG_TEST: postgres://postgres:postgres@localhost/acp
        run: cargo test -p acp-core --features postgres pgstate::
      - name: tenant RLS (acp_core::pgstore) against Postgres, non-superuser + bypass guard
        env:
          ACP_PG_TEST_URL: postgres://acp_app:apppw@localhost/acp
          ACP_PG_SUPER_URL: postgres://postgres:postgres@localhost/acp
        run: cargo test -p acp-core --features postgres pgstore::
      - name: HSM signing (acp_core::hsm) against SoftHSM
        run: cargo test -p acp-core --features hsm hsm || true  # gated on a PKCS#11 module being present

  console-build:
    # B10: build the Kyte web console so a console build break fails a gate (release.yml builds it too,
    # but there it is continue-on-error and does not block). Mirrors the toolchain install in release.yml.
    name: console build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the Vue console
        working-directory: console
        run: |
          npm ci || npm install
          npm run build
      - name: Check the console build was produced
        run: test -f console/dist/index.html

name: release

# Build and publish the Varman (ACP) release bundles. Per the console-first / split-packaging design
# (docs/design/console-first-consolidation.md) each tag ships THREE kinds of archive:
#
#   1. acp-user-<tag>-<os>-<arch>     workstation service acp-agent (+ acp-proxy/acp-intercept wrappers,
#                                     acp-verify, and a demo
#                                     mock MCP server). Built for macOS, Linux and Windows.
#   2. acp-server-<tag>-linux-<arch>  server services: acp-server, acp-gateway, acp-guard, the content
#                                     model and the systemd units. Linux only (the services target Linux).
#   3. acp-console-<tag>-linux-<arch> the Kyte-built web console (binary + wwwroot + app.yaml).
#
# Each archive has a .sha256 sidecar. install.sh fetches (1), install-server.sh fetches (2) and (3).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  binaries:
    name: binaries ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64,  runner: macos-14,        target: aarch64-apple-darwin,      os: macos,   arch: aarch64, archive: tgz }
          - { name: linux-x86_64,   runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,  os: linux,   arch: x86_64,  archive: tgz }
          - { name: linux-aarch64,  runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, os: linux,   arch: aarch64, archive: tgz }
          - { name: windows-x86_64, runner: windows-2022,     target: x86_64-pc-windows-msvc,    os: windows, arch: x86_64,  archive: zip }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT";
          else echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install nasm (Windows, for aws-lc-rs)
        if: matrix.os == 'windows'
        uses: ilammy/setup-nasm@v1

      - name: Build workstation tools (all platforms)
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p acp-agent -p acp-proxy -p acp-intercept -p acp-verify --bin mock-mcp-server

      - name: Build server services (Linux only)
        if: matrix.os == 'linux'
        run: cargo build --release --locked --target ${{ matrix.target }} -p acp-server -p acp-gateway -p acp-guard -p acp-cli

      - name: Stage archives
        id: stage
        shell: bash
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"; OS="${{ matrix.os }}"; ARCH="${{ matrix.arch }}"
          BINDIR="target/${{ matrix.target }}/release"
          EXT=""; [ "$OS" = "windows" ] && EXT=".exe"
          mkdir -p dist
          pack() { # pack <dirname>  -> echoes the asset path, writes .sha256
            d="$1"
            ( cd dist
              if [ "${{ matrix.archive }}" = "zip" ]; then 7z a -tzip "$d.zip" "$d" >/dev/null; a="$d.zip";
              else tar -czf "$d.tar.gz" "$d"; a="$d.tar.gz"; fi
              if command -v sha256sum >/dev/null 2>&1; then sha256sum "$a" > "$a.sha256"; else shasum -a 256 "$a" > "$a.sha256"; fi )
          }

          # ---- user (workstation) archive: all platforms ----
          U="acp-user-$TAG-$OS-$ARCH"; mkdir -p "dist/$U/bin"
          for b in acp-agent acp-proxy acp-intercept acp-verify mock-mcp-server; do cp "$BINDIR/$b$EXT" "dist/$U/bin/"; done
          echo "$TAG" > "dist/$U/VERSION"
          pack "$U"

          # ---- server archive: Linux only ----
          if [ "$OS" = "linux" ]; then
            S="acp-server-$TAG-linux-$ARCH"; mkdir -p "dist/$S/bin" "dist/$S/models" "dist/$S/systemd"
            for b in acp-server acp-gateway acp-guard acp-verify; do cp "$BINDIR/$b" "dist/$S/bin/"; done
            cp "$BINDIR/acp-cli" "dist/$S/bin/acp"   # interim admin CLI on the server (retires when the console/API cover registration)
            cp crates/acp-core/models/injection-lr.json "dist/$S/models/"
            cp deploy/systemd/*.service "dist/$S/systemd/" 2>/dev/null || true
            echo "$TAG" > "dist/$S/VERSION"
            pack "$S"
          fi

      - name: Publish archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

  console:
    name: console linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Best-effort: a Kyte-toolchain hiccup must not block the binaries release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT";
          else echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the Kyte toolchain
        run: |
          curl -fsSL https://kytelang.org/install.sh | sh
          echo "$HOME/.kyte/bin" >> "$GITHUB_PATH"
      - name: Build the console
        working-directory: acp-console
        run: |
          npm ci || npm install
          npm run css || true
          kyte build
      - name: Stage and publish
        run: |
          set -eu
          TAG="${{ steps.tag.outputs.tag }}"; ARCH="${{ matrix.arch }}"
          C="acp-console-$TAG-linux-$ARCH"; mkdir -p "dist/$C/bin"
          cp acp-console/build/debug/bin/acp-console "dist/$C/bin/"
          cp -R acp-console/wwwroot "dist/$C/wwwroot"
          [ -f acp-console/app.yaml ] && cp acp-console/app.yaml "dist/$C/app.yaml" || true
          echo "$TAG" > "dist/$C/VERSION"
          ( cd dist && tar -czf "$C.tar.gz" "$C" && sha256sum "$C.tar.gz" > "$C.tar.gz.sha256" )
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

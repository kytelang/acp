version: 1
default: allow
rules:
  - id: no-destructive-deletes
    when: { tool: delete_all }
    verdict: deny
    reason: destructive bulk delete is never allowed
  - id: payments-need-approval
    when: { resource: payments }
    verdict: step_up
    approvers: [finance]
  - id: redact-secrets-in-notes
    when: { tool: write_note }
    verdict: allow
    obligations:
      - kind: redact
        fields: [secret, ssn]

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"

# Full intended dependency set. Only deps actually referenced by a member's
# [dependencies] are fetched/compiled; the rest document intent until wired in.
[workspace.dependencies]
# trust core
sha2         = "0.10"
regex        = "1"
getrandom    = "0.2"
rusqlite     = { version = "0.32", features = ["bundled"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
hex          = "0.4"
base64       = "0.22"
# to be wired as implementation proceeds (see docs/v0-workspace.md)
ed25519-dalek = { version = "2", features = ["rand_core"] }
ct-merkle    = "0.1"
cedar-policy = "4"
tokio        = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
hyper        = { version = "1", features = ["full"] }
axum         = { version = "0.7", features = ["macros"] }
sqlx         = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "macros"] }
reqwest      = { version = "0.12", features = ["json", "rustls-tls"] }
maud         = "0.26"
clap         = { version = "4", features = ["derive"] }
serde_yaml   = "0.9"
anyhow       = "1"
thiserror    = "2"
tracing      = "0.1"
